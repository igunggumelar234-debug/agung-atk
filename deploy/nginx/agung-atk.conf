# =============================================================================
# Template server block Nginx — Agung ATK (produksi, PHP-FPM 8.3)
# =============================================================================
# Pemakaian (sebagai root di VPS, setelah deploy/setup-vps.sh):
#   cp deploy/nginx/agung-atk.conf /etc/nginx/sites-available/agung-atk
#   # GANTI: domain-anda.example (server_name & path sertifikat)
#   ln -sf /etc/nginx/sites-available/agung-atk /etc/nginx/sites-enabled/
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d domain-anda.example -d www.domain-anda.example
#
# Prasyarat: php8.3-fpm aktif, aplikasi di /var/www/agung-atk (root = public/).
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name domain-anda.example www.domain-anda.example;

    # Tantangan ACME certbot tetap boleh lewat HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/agung-atk/public;
    }

    # Seluruh trafik dipaksa HTTPS (webhook & aplikasi wajib HTTPS).
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # 'http2' lama (kompatibel nginx 1.18–1.25); nginx >= 1.25.1 boleh
    # memakai blok terpisah `http2 on;`.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name domain-anda.example www.domain-anda.example;

    root /var/www/agung-atk/public;
    index index.php;

    # Sertifikat TLS (hasil certbot --nginx atau manual letsencrypt).
    ssl_certificate     /etc/letsencrypt/live/domain-anda.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/domain-anda.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Batas unggah berkas — bukti pembayaran (gambar/PDF) seukuran wajar.
    client_max_body_size 8m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
        text/xml application/xml image/svg+xml;

    # Aset build Vite bernama hash — aman di-cache agresif.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Berkas statis publik lain (uploads di storage link, gambar produk).
    location /storage/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Routing aplikasi (front controller Laravel).
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Eksekusi PHP via PHP-FPM — hanya berkas yang benar-benar ada.
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Rahasia tidak boleh tersaji: .env, .git, skrip, dsb.
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /\.ht {
        deny all;
    }

    access_log /var/log/nginx/agung-atk.access.log;
    error_log  /var/log/nginx/agung-atk.error.log;
}
