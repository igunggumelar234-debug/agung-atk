; =============================================================================
; Supervisor — Scheduler Agung ATK (alternatif cron; jalankan SATU proses saja)
; =============================================================================
; Cara pakai:
;   1. Salin ke /etc/supervisor/conf.d/agung-atk-scheduler.conf
;   2. sudo supervisorctl reread && sudo supervisorctl update
;
; Scheduler menjalankan tugas terjadwal tiap menit (schedule:work):
;   - 07:00 WIB : ringkasan penjualan harian -> notifikasi admin
;   - 02:00 WIB : prune job gagal (retensi 30 hari)
;   - 02:15 WIB : prune batch queue (retensi 30 hari)
;
; PENTING: JANGAN jalankan schedule:work bersamaan dengan cron schedule:run
; (pilih salah satu; keduanya sudah aman berkat withoutOverlapping, tapi
;  cukup satu saja agar hemat sumber daya).
; =============================================================================

[program:agung-atk-scheduler]
process_name=%(program_name)s
command=php /var/www/agungatkopencode/artisan schedule:work
directory=/var/www/agungatkopencode
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/agungatkopencode/storage/logs/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=30
