; =============================================================================
; Supervisor — Queue Worker Agung ATK (Linux / Plesk / shared hosting dgn Supervisor)
; =============================================================================
; Cara pakai:
;   1. Salin file ini ke /etc/supervisor/conf.d/agung-atk-worker.conf
;      (sesuaikan path /var/www/agungatkopencode & user www-data)
;   2. sudo supervisorctl reread && sudo supervisorctl update
;   3. sudo supervisorctl status        -> cek status worker
;   4. Setelah deploy kode baru:        sudo supervisorctl restart agung-atk-worker
;
; Worker memproses notifikasi & pekerjaan latar belakang (tabel jobs).
; tanpa worker aktif, notifikasi berstatus pending TIDAK terkirim.
; =============================================================================

[program:agung-atk-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/agungatkopencode/artisan queue:work database --tries=3 --max-time=3600 --sleep=3
directory=/var/www/agungatkopencode
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/agungatkopencode/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=60
